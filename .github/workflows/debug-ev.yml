name: debug-ev
on:
  push:
    branches: [mike/debug-ev]
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true   # only your GitHub SSH keys can connect
        env:
          EV_SIGNING_CERT: ${{ secrets.EV_SIGNING_CERT }}
          EV_KEYSTORE: ${{ vars.EV_KEYSTORE }}
          EV_KEY: ${{ vars.EV_KEY }}
          EV_TSA_URL: ${{ vars.EV_TSA_URL }}
